<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>AstraSolaris — Open-Source Astronomical Simulation Platform</title>
    <meta
      name="title"
      content="AstraSolaris — Open-Source Astronomical Simulation Platform"
    />
    <meta
      name="description"
      content="Describe space scenarios in plain English and produce interactive 3D visualizations. AstraSolaris is built around Astra—a domain-specific scripting language for astronomical simulation."
    />
    <meta
      name="keywords"
      content="astronomy, simulation, 3D visualization, space, solar system, Astra language, open source, education, science"
    />
    <meta name="author" content="AstraSolaris Team" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://astra-solaris.org/" />
    <meta
      property="og:title"
      content="AstraSolaris — Open-Source Astronomical Simulation Platform"
    />
    <meta
      property="og:description"
      content="Describe space scenarios in plain English and produce interactive 3D visualizations with the Astra scripting language."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AstraSolaris - Explore the cosmos" />
    <meta property="og:site_name" content="AstraSolaris" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://astra-solaris.org/" />
    <meta
      name="twitter:title"
      content="AstraSolaris — Open-Source Astronomical Simulation Platform"
    />
    <meta
      name="twitter:description"
      content="Describe space scenarios in plain English and produce interactive 3D visualizations with the Astra scripting language."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="AstraSolaris - Explore the cosmos"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://astra-solaris.org/" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AstraSolaris",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web Browser",
        "description": "An open-source platform for astronomical simulation, built around Astra—a domain-specific scripting language designed so that scientists, educators, and enthusiasts can describe space scenarios in plain English and produce interactive 3D visualizations.",
        "url": "https://astra-solaris.org",
        "author": {
          "@type": "Organization",
          "name": "AstraSolaris Team",
          "url": "https://astra-solaris.org"
        },
        "license": "https://opensource.org/licenses/MIT",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "screenshot": "https://astra-solaris.org/og-image.png"
      }
    </script>

    <!-- Critical CSS for above-the-fold content -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #0a0e17;
        color: #e2e8f0;
        line-height: 1.6;
        overflow-x: hidden;
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Loading state */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e17;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      .app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-content {
        text-align: center;
      }

      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
      }

      .loading-text {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.25rem;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.05em;
      }

      .loading-dots::after {
        content: "";
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(0.95);
        }
      }

      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }

      /* Skip to main content link for accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #6366f1;
        color: #ffffff;
        padding: 8px 16px;
        z-index: 10000;
        text-decoration: none;
        font-weight: 500;
        border-radius: 0 0 4px 0;
        transition: top 0.3s ease;
      }

      .skip-link:focus {
        top: 0;
      }

      /* Noscript fallback */
      .noscript-message {
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        padding: 40px 20px;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .noscript-message h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 2.5rem;
        margin-bottom: 16px;
        background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .noscript-message p {
        font-size: 1.125rem;
        color: #cbd5e1;
        max-width: 500px;
        margin-bottom: 24px;
      }

      .noscript-message a {
        color: #a5b4fc;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Application root -->
    <div id="app">
      <!-- Loading state shown while JavaScript loads -->
      <div class="app-loading" id="app-loading" aria-live="polite">
        <div class="loading-content">
          <svg
            class="loading-logo"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <!-- Outer ring representing orbit -->
            <circle
              cx="50"
              cy="50"
              r="45"
              stroke="url(#orbit-gradient)"
              stroke-width="1.5"
              fill="none"
              opacity="0.6"
            />
            <!-- Inner orbital path -->
            <ellipse
              cx="50"
              cy="50"
              rx="35"
              ry="20"
              stroke="url(#orbit-gradient)"
              stroke-width="1"
              fill="none"
              transform="rotate(-20 50 50)"
              opacity="0.4"
            />
            <!-- Central star/sun -->
            <circle cx="50" cy="50" r="12" fill="url(#sun-gradient)" />
            <!-- Glow effect -->
            <circle
              cx="50"
              cy="50"
              r="16"
              fill="url(#glow-gradient)"
              opacity="0.5"
            />
            <!-- Orbiting planet -->
            <circle cx="78" cy="38" r="5" fill="url(#planet-gradient)" />
            <!-- Planet glow -->
            <circle
              cx="78"
              cy="38"
              r="7"
              fill="url(#planet-glow)"
              opacity="0.3"
            />
            <!-- Gradients -->
            <defs>
              <linearGradient
                id="orbit-gradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
              <radialGradient
                id="sun-gradient"
                cx="50%"
                cy="50%"
                r="50%"
                fx="30%"
                fy="30%"
              >
                <stop offset="0%" stop-color="#fbbf24" />
                <stop offset="70%" stop-color="#f59e0b" />
                <stop offset="100%" stop-color="#d97706" />
              </radialGradient>
              <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
              </radialGradient>
              <linearGradient
                id="planet-gradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#60a5fa" />
                <stop offset="100%" stop-color="#3b82f6" />
              </linearGradient>
              <radialGradient id="planet-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
              </radialGradient>
            </defs>
          </svg>
          <p class="loading-text">
            Initializing AstraSolaris<span class="loading-dots"></span>
          </p>
        </div>
      </div>

      <!-- Main content will be injected here by JavaScript -->
      <noscript>
        <div class="noscript-message">
          <h1>🌌 AstraSolaris</h1>
          <p>
            AstraSolaris requires JavaScript to create interactive 3D
            astronomical visualizations. Please enable JavaScript in your
            browser to explore the cosmos.
          </p>
          <p>
            In the meantime, you can read our
            <a href="https://github.com/astra-solaris/astra-solaris"
              >documentation on GitHub</a
            >.
          </p>
        </div>
      </noscript>
    </div>

    <!-- Canvas for starfield background -->
    <canvas
      id="starfield-canvas"
      aria-hidden="true"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      "
    ></canvas>

    <!-- Main application entry point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
